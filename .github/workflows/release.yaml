name: Release binaries
# Builds the standalone seviri2area binary for Linux, macOS and Windows on
# x86_64 and arm64 and, on a v* tag, attaches them to the GitHub release. Pull
# requests touching the build only build, so a broken build is caught before
# it is tagged.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - scripts/build_binary.sh
      - src/geoips_mcidas/cli.py
      - uv.lock
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux_2_28 so the binary needs only glibc
          # 2.28 (RHEL/Rocky 8 and newer). Built on the runner itself it would
          # need the runner's glibc 2.39.
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          # The build script targets macOS 11, whatever the runner's version.
          - name: macos-arm64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-2025
            exe: .exe
          - name: windows-arm64
            runner: windows-11-arm
            exe: .exe
    runs-on: ${{ matrix.runner }}
    # An empty image runs the job on the runner directly.
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        # Git Bash on Windows, so one build script serves every platform.
        shell: bash
    env:
      NAME: seviri2area-${{ matrix.name }}
      BINARY: dist/seviri2area-${{ matrix.name }}${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: scripts/build_binary.sh "$NAME"
      - name: Smoke test
        # No HRIT data is available here; the golden tests cover conversion.
        # This proves the bundled imports resolve and errors exit non-zero.
        run: |
          "$BINARY" --help
          if "$BINARY" does-not-exist; then
            echo "::error::a missing input exited 0"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}*
          if-no-files-found: error
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the tag matches the package version
        # The binary reports the pyproject version, so a mismatched tag would
        # publish files claiming to be a different release.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: seviri2area-*
          merge-multiple: true
          path: dist
      - name: Publish
        # Attach to a release drafted by hand if there is one, else create it.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
