name: Run Pytest
on:
  push:
    branches: 'main'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        timeout-minutes: 10
        # Golden tests need the 303 MB reference AREA file, which is not in the
        # repo; they deselect themselves when it is absent.
        run: uv run --extra test pytest -v
